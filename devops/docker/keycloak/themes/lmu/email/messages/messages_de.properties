# LMU AIS-Chat: deutsche E-Mail-Texte (überschreiben das Keycloak-Standard-Theme).
#
# Gilt für die Admin-Aktion "Execute Actions" (Keycloak-Konsole: Users -> Credentials
# bzw. Required actions -> E-Mail senden). Nur dieser Mailtyp ist angepasst; alle anderen
# Mails (Passwort zurücksetzen, E-Mail verifizieren, ...) bleiben beim Standard-Text.
#
# VORAUSSETZUNG im Realm (Realm settings -> Localization): "Internationalization" an,
# Supported locales "Deutsch", Default locale "Deutsch". Ohne das nimmt Keycloak die
# Locale "en", findet diese Datei nicht und die Mail enthält nur rohe Schlüsselnamen.
# (Die Einstellung stellt auch die Login-Seiten auf Deutsch um.)
#
# Die Gültigkeit des Links kommt NICHT aus diesem Text, sondern aus dem Realm:
# Realm settings -> Tokens -> "Default admin-initiated action lifespan"
# (Realm-JSON: actionTokenGeneratedByAdminLifespan, in Sekunden). Der Text unten setzt
# die dort eingestellte Dauer automatisch ein, z. B. "24 Stunden".

# Betreff (fest, weil Keycloak ihn immer über diesen Schlüssel holt)
executeActionsSubject=Ihr Zugang zu LMU AIS-Chat

# Anrede: mit Namen bzw. ohne, falls im Benutzerkonto weder Vor- noch Nachname gepflegt sind
# {0} = Vorname Nachname
executeActionsSalutationNamed=Sehr geehrte/r {0},
executeActionsSalutationAnonymous=Sehr geehrte Damen und Herren,

# Gültigkeitsdauer bei ganzen Stunden (Keycloak würde 24 Stunden sonst als "1 Tag" ausgeben)
executeActionsExpiryOneHour=1 Stunde
executeActionsExpiryHours={0} Stunden

# Neuer Account, einzige offene Aktion ist "Passwort aktualisieren"
# {0} = Link, {1} = Gültigkeitsdauer (z. B. "24 Stunden")
executeActionsPasswordBody=willkommen bei LMU AIS-Chat, Ihr Account wurde gerade angelegt. Um LMU AIS-Chat nutzen zu können, müssen Sie Ihr Passwort aktualisieren. Bitte klicken Sie dazu den folgenden Link:\n\n{0}\n\nDieser Link ist {1} gültig.\n\nMit freundlichen Grüßen\n\nDigiLLab der LMU
executeActionsPasswordBodyHtml=<p>willkommen bei LMU AIS-Chat, Ihr Account wurde gerade angelegt. Um LMU AIS-Chat nutzen zu können, müssen Sie Ihr Passwort aktualisieren. Bitte klicken Sie dazu den folgenden Link:</p><p><a href="{0}">Passwort jetzt aktualisieren</a></p><p>Dieser Link ist {1} gültig.</p><p>Mit freundlichen Grüßen</p><p>DigiLLab der LMU</p>

# Alle anderen Aktionen (oder mehrere gleichzeitig): allgemeiner Text mit Aktionsliste
# {0} = Link, {1} = Aktionen (z. B. "Profil aktualisieren"), {2} = Gültigkeitsdauer
executeActionsGenericBody=für Ihren Account bei LMU AIS-Chat sind folgende Aktion(en) erforderlich: {1}. Bitte klicken Sie dazu den folgenden Link:\n\n{0}\n\nDieser Link ist {2} gültig.\n\nFalls Sie diese Aufforderung nicht erwartet haben, ignorieren Sie diese Nachricht; Ihr Account bleibt dann unverändert.\n\nMit freundlichen Grüßen\n\nDigiLLab der LMU
executeActionsGenericBodyHtml=<p>für Ihren Account bei LMU AIS-Chat sind folgende Aktion(en) erforderlich: {1}. Bitte klicken Sie dazu den folgenden Link:</p><p><a href="{0}">Link zu Ihrem Account öffnen</a></p><p>Dieser Link ist {2} gültig.</p><p>Falls Sie diese Aufforderung nicht erwartet haben, ignorieren Sie diese Nachricht; Ihr Account bleibt dann unverändert.</p><p>Mit freundlichen Grüßen</p><p>DigiLLab der LMU</p>
